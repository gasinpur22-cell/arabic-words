<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калимат</title>
<meta name="theme-color" content="#f1f1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Калимат">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Тема выставляется до отрисовки, чтобы не мигало.
  try { var t = localStorage.getItem("kalimat.theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
  /* Фон до загрузки style.css: без белой или чёрной вспышки на ярлыке iPhone. */
  html { background: #f1f1ee; }
  @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #151514; } }
  html[data-theme="dark"] { background: #151514; }
</style>
<link rel="preload" href="fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/scheherazade-new-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="firebase-config.js"></script>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
